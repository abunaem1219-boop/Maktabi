<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>মুক্তলিপি (Muktolipi) - প্রফেশনাল ডকুমেন্ট ও বই এডিটর</title>
    <meta name="description" content="প্রফেশনাল মোবাইল-ফার্স্ট ডকুমেন্ট ও বই লেখার অ্যাপ্লিকেশন (Word-style WYSIWYG Editor)" />
    <meta property="og:title" content="মুক্তলিপি (Muktolipi)" />
    <meta property="og:description" content="প্রফেশনাল মোবাইল-ফার্স্ট ডকুমেন্ট ও বই লেখার অ্যাপ্লিকেশন" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="মুক্তলিপি" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('muktolipi-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || saved === 'amoled' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            if (saved === 'amoled') document.documentElement.classList.add('amoled-mode');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
