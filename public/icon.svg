<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Background (Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Document Pages behind -->
  <g filter="url(#shadow)">
    <!-- Back page -->
    <rect x="110" y="90" width="280" height="340" rx="16" fill="#cbd5e1" opacity="0.6" transform="rotate(-6 250 260)" />
    <!-- Middle page -->
    <rect x="116" y="90" width="280" height="340" rx="16" fill="#e2e8f0" opacity="0.85" transform="rotate(3 256 260)" />
    <!-- Front Main Paper Sheet -->
    <rect x="116" y="86" width="280" height="340" rx="16" fill="url(#pageGrad)" />
    
    <!-- Paper Lines / Prose Representation -->
    <rect x="156" y="140" width="200" height="14" rx="7" fill="#0d9488" opacity="0.85" />
    <rect x="156" y="176" width="160" height="10" rx="5" fill="#94a3b8" />
    <rect x="156" y="204" width="200" height="10" rx="5" fill="#cbd5e1" />
    <rect x="156" y="232" width="180" height="10" rx="5" fill="#cbd5e1" />
    <rect x="156" y="260" width="190" height="10" rx="5" fill="#cbd5e1" />
    <rect x="156" y="288" width="140" height="10" rx="5" fill="#cbd5e1" />
    <rect x="156" y="316" width="170" height="10" rx="5" fill="#cbd5e1" />
    
    <!-- Bengali Letter 'ম' / Feather Quill Stylized Nib -->
    <path d="M 330 330 L 375 235 C 385 210, 370 190, 350 185 C 330 180, 310 195, 305 215 L 285 280 Z" fill="url(#penGrad)" filter="url(#shadow)"/>
    <polygon points="330,330 315,365 345,345" fill="#ca8a04" />
    <circle cx="332" cy="270" r="4" fill="#854d0e" />
  </g>
</svg>
